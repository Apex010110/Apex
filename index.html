<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PiGenie • AI Chat</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="bg"></div>
  <header class="topbar">
    <div class="brand"><div class="logo">π</div><div class="titles"><h1>PiGenie</h1><p class="subtitle">AI chat • Web RAG • Akinator</p></div></div>
    <div class="actions"><button id="clearBtn" class="ghost">Clear</button><div class="session">Session: <span id="sid"></span></div><button id="themeBtn" class="ghost">☾</button></div>
  </header>
  <main class="wrap">
    <div class="mode-tabs" role="tablist">
      <button class="tab active" data-mode="chat" aria-selected="true">Chat</button>
      <button class="tab" data-mode="rag" aria-selected="false">Web RAG</button>
      <button class="tab" data-mode="akinator" aria-selected="false">Akinator</button>
    </div>
    <div id="chat" class="chat"><div class="bubble bot intro"><div class="bot-avatar">🤖</div><div class="content"><div class="name">PiGenie</div><div>Hi! Choose a mode above and ask me anything.</div></div></div></div>
    <div id="sources" class="sources hidden"></div>
    <form id="composer" class="composer" autocomplete="off"><textarea id="msg" placeholder="Type your message…" rows="1"></textarea><button id="sendBtn" class="send" type="submit"><span class="send-icon">➤</span></button></form>
    <div id="typing" class="typing hidden"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </main>
  <footer class="foot"><span>Running on FastAPI • Works local & cloud</span></footer>
  <script src="/static/js/app.js"></script>
</body>
</html>
